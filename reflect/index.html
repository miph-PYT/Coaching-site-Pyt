<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Session reflection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f4e9d8;      /* page */
  --sand:#e9ddc3;       /* cards */
  --sand-2:#ddd4c3;     /* card hover/active */
  --leaf:#e2ebc9;       /* pale green panel */
  --sage:#c8d6ad;       /* sage circle */
  --peach:#f8c8a4;      /* peach circle */
  --stone:#ddd6ca;      /* grey circle */
  --pill:#f6efe3;       /* pills */
  --ink:#1f1a17;
  --muted:#5e554d;
  --rust:#a8521f;       /* outline button */
  --rust-ink:#8a3f13;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:400 18px/1.6 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:760px;margin:0 auto;padding:32px 22px 80px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:36px}
.brand{font:700 1.1rem/1.2 Fraunces,Georgia,serif;color:var(--ink);text-decoration:none}
.langs{display:flex;gap:6px}
.pillbtn{background:var(--pill);border:0;border-radius:999px;padding:7px 14px;font:500 .9rem Figtree,sans-serif;color:var(--muted);cursor:pointer}
.pillbtn[aria-pressed="true"]{background:var(--ink);color:var(--cream)}

h1,h2,.display{font-family:Fraunces,Georgia,serif;font-weight:900;letter-spacing:-.01em;line-height:1.05;margin:0;font-variation-settings:"opsz" 144}
h1{font-size:clamp(2.3rem,7vw,3.6rem);margin-bottom:16px}
h2{font-size:clamp(1.6rem,4.5vw,2.1rem);margin-bottom:10px}
p{margin:0 0 14px}
.muted{color:var(--muted)}
.small{font-size:.92rem}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rust);outline-offset:3px}

/* panels */
.panel{background:var(--leaf);border-radius:40px;padding:clamp(26px,5vw,48px)}
.card{background:var(--sand);border-radius:32px;padding:22px 26px}

/* progress */
.progress{display:flex;gap:8px;margin:0 0 30px}
.progress span{height:6px;flex:1;border-radius:3px;background:var(--sand)}
.progress span.on{background:var(--sage)}

.qtitle{font:900 clamp(1.7rem,5vw,2.3rem)/1.1 Fraunces,Georgia,serif;font-variation-settings:"opsz" 144;margin:0 0 10px;display:block}
.hint{color:var(--muted);margin-bottom:22px}
textarea,input[type=text],input[type=email],select{width:100%;background:var(--pill);border:1.5px solid transparent;border-radius:22px;padding:14px 18px}
textarea:focus,input:focus,select:focus{border-color:var(--sage);outline:none}
textarea{min-height:140px;resize:vertical;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--pill);border:0;border-radius:999px;padding:10px 18px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sage)}
.sublabel{display:block;color:var(--muted);font-size:.95rem;margin:24px 0 8px}

.scale{display:flex;gap:10px;flex-wrap:wrap}
.scale button{width:58px;height:58px;border-radius:50%;border:0;background:var(--pill);font:900 1.3rem Fraunces,Georgia,serif;cursor:pointer}
.scale button[aria-pressed="true"]{background:var(--peach)}
.scale-ends{display:flex;justify-content:space-between;color:var(--muted);font-size:.88rem;margin:8px 0 0;max-width:330px}

.options{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:18px;text-align:left;background:var(--sand);border:0;border-radius:32px;padding:16px 22px;cursor:pointer}
.opt:hover{background:var(--sand-2)}
.opt[aria-pressed="true"]{background:var(--sand-2);box-shadow:inset 0 0 0 2px var(--ink)}
.dot{flex:none;width:46px;height:46px;border-radius:50%}
.opt b{display:block;font:700 1.2rem/1.2 Fraunces,Georgia,serif}
.opt span.sub{color:var(--muted);font-size:.95rem}

.nav{display:flex;justify-content:space-between;align-items:center;margin-top:32px;gap:12px}
.btn{display:inline-block;border:0;border-radius:999px;padding:15px 28px;font:700 1.05rem Fraunces,Georgia,serif;cursor:pointer;background:var(--ink);color:var(--cream);text-decoration:none}
.btn.outline{background:none;color:var(--rust-ink);box-shadow:inset 0 0 0 1.5px var(--rust)}
.btn:disabled{opacity:.35;cursor:default}
.linkbtn{background:none;border:0;color:var(--muted);cursor:pointer;padding:8px 0;text-decoration:underline;text-underline-offset:4px}

/* coach panel */
.coach{background:var(--pill);border-radius:28px;padding:20px 24px;margin-bottom:28px}
.coach summary{cursor:pointer;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.grid2 .full{grid-column:1/-1}
.field label{display:block;font-size:.88rem;color:var(--muted);margin-bottom:6px}
.coach input,.coach select,.coach textarea{background:var(--cream)}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}

/* result */
.next{margin:28px 0 22px}
.next .kicker{color:var(--muted);margin-bottom:6px}
.quote{margin:0 0 18px}
.quote cite{display:block;font-style:normal;color:var(--muted);font-size:.9rem;margin-bottom:2px}
.quote q{font:400 1.25rem/1.45 Fraunces,Georgia,serif;quotes:"“" "”"}
.coachnote{font:400 1.25rem/1.45 Fraunces,Georgia,serif}

/* the path */
.arc{margin:8px 0 22px}
.arc svg{width:100%;height:auto;display:block;overflow:visible}
.arc .path{stroke:var(--ink);stroke-opacity:.25;stroke-width:2;fill:none;stroke-dasharray:2 7;stroke-linecap:round}
.arc .walked{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round}
.arc .lbl{font:700 17px Fraunces,Georgia,serif;fill:var(--muted)}
.arc .lbl.now{fill:var(--ink);font-weight:900}
.arc .num{font:900 20px Fraunces,Georgia,serif;fill:var(--ink)}
.arc .here{font:500 13px Figtree,sans-serif;fill:var(--rust-ink)}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:28px}
.status{font-size:.92rem;color:var(--muted);margin-top:16px}
.hidden{display:none!important}
@media (prefers-reduced-motion:no-preference){
  .reveal{animation:rise .5s ease-out both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" id="brand" href="/"></a>
    <div class="langs">
      <a class="pillbtn hidden" id="contactTop" style="text-decoration:none"></a>
      <button class="pillbtn" data-lang="en" aria-pressed="true">EN</button>
      <button class="pillbtn" data-lang="da" aria-pressed="false">DA</button>
    </div>
  </header>

  <!-- Coach setup: shown only when the address ends in #coach -->
  <details class="coach hidden" id="coach" open>
    <summary data-t="coachTitle"></summary>
    <p class="muted small" style="margin-top:8px" data-t="coachHelp"></p>
    <div class="grid2">
      <div class="field"><label for="cName" data-t="cName"></label><input type="text" id="cName" autocomplete="off"></div>
      <div class="field"><label for="cNum" data-t="cNum"></label><select id="cNum"></select></div>
      <div class="field full"><label for="cNote" data-t="cNote"></label><textarea id="cNote" style="min-height:90px"></textarea></div>
    </div>
  </details>

  <main id="app"></main>
</div>

<script>
/* ===================== CONFIG ===================== */
const CONFIG = {
  coachName: "Philipp",
  homeUrl: "https://www.parts-work.dk/",          // where the name in the top-left links to
  bookingUrl: "https://www.parts-work.dk/",        // e.g. "https://cal.com/yourname/session" – "" uses email instead
  email: "philipp.mitterhofer@gmail.com",             // e.g. "hello@parts-work.dk"
  contactUrl: "https://www.parts-work.dk/",        // e.g. "https://parts-work.dk/#contact" – "" uses email instead
  sheetUrl: "https://script.google.com/macros/s/AKfycbw-pub0-nrdBTE2keLlcSk1qVF3azVSr2LxXnxdhl_8pzmt4GRdsipFvxyP_V3cHpBwGw/exec"           // Google Apps Script web-app URL – "" means answers aren't stored
};
/* ================================================== */

const T = {
  en:{
    brand:`Coaching with ${CONFIG.coachName}`, back:"Back", next:"Next", finish:"See my next step",
    coachTitle:"Session setup (only you see this)",
    coachHelp:"Fill this in, then hand over the screen. Your note appears on the client’s result.",
    cName:"Client first name", cNum:"Which session was this?", cNote:"Your suggested next step (optional)",
    intake:"Intake session", sess:n=>`Session ${n} of 5`,
    startTitle:"A few minutes, while it’s fresh",
    startHi:name=>`Hi ${name}. A few minutes, while it’s fresh`,
    startBody:"Six short questions about today. There are no right answers, and anything you skip is fine. At the end you’ll see a clear next step.",
    start:"Start",
    q1:"What feels most important from today?", q1h:"A moment, a sentence, something you noticed.",
    q2:"How are you leaving right now?", q2h:"Pick any that fit.",
    moods:["Lighter","Clearer","Stirred up","Tender","Energised","Tired","Unsure","Hopeful"],
    moodOther:"Or in your own words",
    q3i:"If this works, what’s different for you in three months?", q3ih:"Be as concrete as you can. What would you be doing, or no longer doing?",
    q3s:"What shifted today, even slightly?", q3sh:"Small counts.",
    q4i:"And if nothing changes, what does that cost you?", q4ih:"Honestly, not dramatically.",
    q4s:"What do you want to try or notice before we meet again?", q4sh:"One thing is plenty.",
    q5:"How useful was today?", q5lo:"Not much", q5hi:"Very", q5b:"Anything I could do differently? (optional)",
    q6:"Where are you with continuing?",
    r:{book:["I want to book the next session","Let’s keep the momentum."],
       ask:["I’d like to, but I have a question first","About practicalities, price, fit, anything."],
       think:["I need a little time to think","That’s completely fine."],
       pause:["Not right now","Also completely fine."]},
    resTitle:name=>name?`Thank you, ${name}.`:"Thank you.",
    resSub:"Here’s where you are, and what comes next.",
    nextKicker:"Your next step",
    nx:{book:["Book your next session","Ideally within the next one to two weeks, while today is still close."],
        ask:["Send me your question","Write it however it comes. I’ll answer personally, and then you can decide."],
        think:["Give it a few days, then decide","Notice whether today keeps coming back to you. That’s usually useful information."],
        pause:["Keep what you found today","No follow-up pressure. If you want to come back later, the door is open."]},
    coachSays:`A note from ${CONFIG.coachName}`,
    whyTitle:"Why continuing makes sense",
    youSaid3i:"What you want, in three months", youSaid4i:"What staying the same costs",
    youSaid1:"What mattered today", youSaid4s:"What you’re taking into the week",
    whyIntake:"Today we mapped the territory. The real work happens over the next sessions, where there’s time to slow down and go underneath the patterns, instead of just talking about them.",
    whyNext:stage=>`Next is ${stage}.`,
    arcTitle:"Where you are", here:"you are here",
    stages:{intake:"Intake",settle:"Settle",excavate:"Excavate",land:"Land"},
    stageDesc:{
      intake:"Getting a picture of where you are and what you want.",
      settle:"Getting grounded, and getting to know the parts of you that are running the show, without trying to fix them yet.",
      excavate:"Going underneath: what those parts protect, what they need, and what has been kept out of sight.",
      land:"Bringing it into your actual life: choices, relationships, and a way of being you can keep."},
    bookBtn:"Book next session", askBtn:"Send my question", sendBtn:`Send my answers to ${CONFIG.coachName}`,
    copyBtn:"Copy my answers", copied:"Copied", again:"Start a new reflection",
    contact:`Contact ${CONFIG.coachName}`, contactShort:"Contact",
    mineTitle:"Get a copy by email", mineHint:`Your answers and your next step, sent to your inbox. ${CONFIG.coachName} sees your email address together with your answers.`,
    mineLabel:"Your email", mineBtn:"Send me a copy", mineSent:"Sent. Check your inbox (and the spam folder, just in case).",
    mineFail:"That didn’t go through. Try again, or use “Copy my answers”.", mineInvalid:"Check the email address.",
    mineOpened:"Your email app should have opened with everything filled in. Just press send.",
    mailNext:"Your next step", mailAnswers:"Your answers", mailWhy:"Why continuing makes sense",
    saved:`Your answers have been sent to ${CONFIG.coachName}.`, saveFail:"Your answers couldn’t be sent. Use “Copy my answers” to keep them.",
    f:{type:"Session",q1:"Most important",mood:"Leaving",q3:"Goal / shift",q4:"Cost / try",use:"Usefulness",better:"Do differently",ready:"Continuing"},
    mailSubject:"Session reflection"
  },
  da:{
    brand:`Coaching med ${CONFIG.coachName}`, back:"Tilbage", next:"Næste", finish:"Se mit næste skridt",
    coachTitle:"Sessionsopsætning (kun du ser dette)",
    coachHelp:"Udfyld, og giv så skærmen videre. Din note vises på klientens resultat.",
    cName:"Klientens fornavn", cNum:"Hvilken session var det?", cNote:"Dit forslag til næste skridt (valgfrit)",
    intake:"Forsamtale", sess:n=>`Session ${n} af 5`,
    startTitle:"Et par minutter, mens det er friskt",
    startHi:name=>`Hej ${name}. Et par minutter, mens det er friskt`,
    startBody:"Seks korte spørgsmål om i dag. Der er ingen rigtige svar, og du må gerne springe over. Til sidst ser du et tydeligt næste skridt.",
    start:"Start",
    q1:"Hvad føles vigtigst fra i dag?", q1h:"Et øjeblik, en sætning, noget du lagde mærke til.",
    q2:"Hvordan går du herfra lige nu?", q2h:"Vælg dem, der passer.",
    moods:["Lettere","Klarere","Rørt op","Sårbar","Energisk","Træt","Usikker","Håbefuld"],
    moodOther:"Eller med dine egne ord",
    q3i:"Hvis det her virker, hvad er så anderledes om tre måneder?", q3ih:"Så konkret som muligt. Hvad gør du, eller gør du ikke længere?",
    q3s:"Hvad flyttede sig i dag, bare en smule?", q3sh:"Små ting tæller.",
    q4i:"Og hvis intet ændrer sig, hvad koster det dig?", q4ih:"Ærligt, ikke dramatisk.",
    q4s:"Hvad vil du prøve eller lægge mærke til, før vi ses igen?", q4sh:"Én ting er rigeligt.",
    q5:"Hvor brugbar var i dag?", q5lo:"Ikke meget", q5hi:"Meget", q5b:"Noget jeg kunne gøre anderledes? (valgfrit)",
    q6:"Hvor er du i forhold til at fortsætte?",
    r:{book:["Jeg vil booke næste session","Lad os holde momentum."],
       ask:["Gerne, men jeg har et spørgsmål først","Om praktik, pris, match, hvad som helst."],
       think:["Jeg har brug for lidt tid til at tænke","Det er helt i orden."],
       pause:["Ikke lige nu","Også helt i orden."]},
    resTitle:name=>name?`Tak, ${name}.`:"Tak.",
    resSub:"Her er, hvor du er, og hvad der kommer nu.",
    nextKicker:"Dit næste skridt",
    nx:{book:["Book din næste session","Gerne inden for en til to uger, mens i dag stadig er tæt på."],
        ask:["Send mig dit spørgsmål","Skriv det, som det kommer. Jeg svarer personligt, og så kan du beslutte dig."],
        think:["Giv det et par dage, og beslut dig så","Læg mærke til, om i dag bliver ved med at dukke op. Det er som regel brugbar information."],
        pause:["Behold det, du fandt i dag","Intet pres. Hvis du vil tilbage senere, står døren åben."]},
    coachSays:`En note fra ${CONFIG.coachName}`,
    whyTitle:"Derfor giver det mening at fortsætte",
    youSaid3i:"Det du vil have om tre måneder", youSaid4i:"Det koster at blive det samme sted",
    youSaid1:"Det der betød noget i dag", youSaid4s:"Det du tager med ind i ugen",
    whyIntake:"I dag kortlagde vi terrænet. Det egentlige arbejde sker i de næste sessioner, hvor der er tid til at sætte tempoet ned og gå ind under mønstrene, i stedet for bare at tale om dem.",
    whyNext:stage=>`Næste fase er ${stage}.`,
    arcTitle:"Hvor du er", here:"du er her",
    stages:{intake:"Forsamtale",settle:"Settle",excavate:"Excavate",land:"Land"},
    stageDesc:{
      intake:"Et billede af, hvor du er, og hvad du vil.",
      settle:"At finde fodfæste og lære de dele af dig at kende, der styrer showet, uden at prøve at fikse dem endnu.",
      excavate:"At gå ind under: hvad de dele beskytter, hvad de har brug for, og hvad der er holdt ude af syne.",
      land:"At bringe det ind i dit faktiske liv: valg, relationer og en måde at være på, du kan holde fast i."},
    bookBtn:"Book næste session", askBtn:"Send mit spørgsmål", sendBtn:`Send mine svar til ${CONFIG.coachName}`,
    copyBtn:"Kopiér mine svar", copied:"Kopieret", again:"Start en ny refleksion",
    contact:`Kontakt ${CONFIG.coachName}`, contactShort:"Kontakt",
    mineTitle:"Få en kopi på mail", mineHint:`Dine svar og dit næste skridt, sendt til din indbakke. ${CONFIG.coachName} ser din mailadresse sammen med dine svar.`,
    mineLabel:"Din mail", mineBtn:"Send mig en kopi", mineSent:"Sendt. Tjek din indbakke (og spamfilteret, for en sikkerheds skyld).",
    mineFail:"Det gik ikke igennem. Prøv igen, eller brug »Kopiér mine svar«.", mineInvalid:"Tjek mailadressen.",
    mineOpened:"Dit mailprogram burde have åbnet med det hele udfyldt. Tryk bare send.",
    mailNext:"Dit næste skridt", mailAnswers:"Dine svar", mailWhy:"Derfor giver det mening at fortsætte",
    saved:`Dine svar er sendt til ${CONFIG.coachName}.`, saveFail:"Dine svar kunne ikke sendes. Brug »Kopiér mine svar« for at beholde dem.",
    f:{type:"Session",q1:"Vigtigst",mood:"Går herfra",q3:"Mål / skift",q4:"Pris / prøve",use:"Brugbarhed",better:"Gøre anderledes",ready:"Fortsætte"},
    mailSubject:"Refleksion efter session"
  }
};

/* Link options:
   …/reflect/#coach               → setup panel for in-session use on your device
   …/reflect/?s=intake&name=Anna  → send to a client after the session (s = intake or 1–5)
   add &note=… for your next-step note, &lang=da for Danish */
const params = new URLSearchParams(location.search);
const coachMode = location.hash === "#coach";

let lang = (params.get("lang") || (navigator.language||"").slice(0,2)) === "da" ? "da" : "en";
const t = k => T[lang][k];
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SESSIONS = ["intake","1","2","3","4","5"];

let state, step, sent = false;
function fresh(){
  const s = params.get("s");
  state = {session: SESSIONS.includes(s) ? s : "intake",
           name: params.get("name") || "", note: params.get("note") || "",
           q1:"", mood:[], moodOther:"", q3:"", q4:"", use:0, better:"", ready:"",
           id: Date.now().toString(36)+Math.random().toString(36).slice(2,7), email:""};
  if(coachMode) readCoach();
  step = 0; sent = false;
}
function readCoach(){
  if(!coachMode) return;
  state.name=$("#cName").value.trim(); state.note=$("#cNote").value.trim(); state.session=$("#cNum").value||"intake";
}
function stageOf(s){ if(s==="intake")return 0; const n=+s; return n===1?1:n<=4?2:3; }
const STAGES = ["intake","settle","excavate","land"];
const isIntake = () => state.session === "intake";

function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent = t(el.dataset.t));
  const brand=$("#brand"); brand.textContent = t("brand"); brand.href = CONFIG.homeUrl;
  const ct=$("#contactTop"); if(contactHref()){ ct.href=contactHref(); ct.textContent=t("contactShort"); ct.classList.remove("hidden"); if(CONFIG.contactUrl) ct.target="_blank"; }
  const sel=$("#cNum"), cur=sel.value;
  sel.innerHTML = SESSIONS.map(v=>`<option value="${v}">${esc(v==="intake"?t("intake"):t("sess")(v))}</option>`).join("");
  sel.value = cur || "intake";
}

/* ---------- steps ---------- */
const STEPS = ["start","q1","q2","q3","q4","q5","q6","result"];
const progress = () => `<div class="progress" aria-hidden="true">${[1,2,3,4,5,6].map(i=>`<span class="${i<=step?'on':''}"></span>`).join("")}</div>`;
const nav = (canNext=true,last=false) => `<div class="nav">
    <button class="linkbtn" data-act="back">${esc(t("back"))}</button>
    <button class="btn" data-act="${last?'finish':'next'}" ${canNext?'':'disabled'}>${esc(last?t("finish"):t("next"))}</button></div>`;
const textQ = (key,label,hint) => `${progress()}<div class="reveal"><label class="qtitle" for="f">${esc(label)}</label>
    <p class="hint">${esc(hint)}</p><textarea id="f" data-key="${key}">${esc(state[key])}</textarea></div>${nav()}`;
const DOTS = ["var(--peach)","var(--sage)","var(--stone)","var(--leaf)"];

function render(){
  const s = STEPS[step];
  if(s==="start"){
    readCoach();
    app.innerHTML = `<div class="panel reveal"><h1>${esc(state.name ? t("startHi")(state.name) : t("startTitle"))}</h1>
      <p class="muted" style="max-width:52ch">${esc(t("startBody"))}</p>
      <div class="nav" style="justify-content:flex-start"><button class="btn" data-act="next">${esc(t("start"))}</button></div></div>`;
  }
  if(s==="q1") app.innerHTML = textQ("q1", t("q1"), t("q1h"));
  if(s==="q2") app.innerHTML = `${progress()}<div class="reveal"><p class="qtitle">${esc(t("q2"))}</p><p class="hint">${esc(t("q2h"))}</p>
      <div class="chips">${t("moods").map((m,i)=>`<button class="chip" data-mood="${i}" aria-pressed="${state.mood.includes(i)}">${esc(m)}</button>`).join("")}</div>
      <label class="sublabel" for="moodOther">${esc(t("moodOther"))}</label>
      <input type="text" id="moodOther" data-key="moodOther" value="${esc(state.moodOther)}" autocomplete="off"></div>${nav()}`;
  if(s==="q3") app.innerHTML = isIntake()? textQ("q3",t("q3i"),t("q3ih")) : textQ("q3",t("q3s"),t("q3sh"));
  if(s==="q4") app.innerHTML = isIntake()? textQ("q4",t("q4i"),t("q4ih")) : textQ("q4",t("q4s"),t("q4sh"));
  if(s==="q5") app.innerHTML = `${progress()}<div class="reveal"><p class="qtitle" style="margin-bottom:22px">${esc(t("q5"))}</p>
      <div class="scale" role="group" aria-label="${esc(t("q5"))}">${[1,2,3,4,5].map(n=>`<button data-use="${n}" aria-pressed="${state.use===n}">${n}</button>`).join("")}</div>
      <div class="scale-ends"><span>${esc(t("q5lo"))}</span><span>${esc(t("q5hi"))}</span></div>
      <label class="sublabel" for="f">${esc(t("q5b"))}</label>
      <textarea id="f" data-key="better" style="min-height:90px">${esc(state.better)}</textarea></div>${nav()}`;
  if(s==="q6"){
    const R=t("r");
    app.innerHTML = `${progress()}<div class="reveal"><p class="qtitle" style="margin-bottom:22px">${esc(t("q6"))}</p>
      <div class="options">${Object.keys(R).map((k,i)=>`<button class="opt" data-ready="${k}" aria-pressed="${state.ready===k}">
        <span class="dot" style="background:${DOTS[i]}"></span><span><b>${esc(R[k][0])}</b><span class="sub">${esc(R[k][1])}</span></span></button>`).join("")}</div></div>
      ${nav(!!state.ready,true)}`;
  }
  if(s==="result") renderResult();
  const f = app.querySelector("textarea#f"); if(f && matchMedia("(pointer:fine)").matches) f.focus();
  window.scrollTo({top:0});
}

/* ---------- the path, numbered like the offer cards ---------- */
function arcSVG(pos){
  const xs=[40,213,386,560], y=52, fills=["var(--stone)","var(--peach)","var(--sage)","var(--leaf)"];
  const d=`M${xs[0]} ${y} C 110 ${y-38}, 150 ${y+34}, ${xs[1]} ${y} S 320 ${y-34}, ${xs[2]} ${y} S 500 ${y+34}, ${xs[3]} ${y}`;
  const walked = pos>0 ? `<path class="walked" d="${d}" pathLength="3" stroke-dasharray="${pos} 3"/>` : "";
  const nodes = xs.map((x,i)=>{
    const r = i===pos?30:22, label = i===0 ? "" : String(i);
    return `<circle cx="${x}" cy="${y}" r="${r}" fill="${fills[i]}" ${i===pos?'stroke="var(--ink)" stroke-width="2"':''}/>`+
      (label?`<text class="num" x="${x}" y="${y+7}" text-anchor="middle">${label}</text>`:"")+
      `<text class="lbl ${i===pos?'now':''}" x="${x}" y="${y+56}" text-anchor="middle">${esc(t("stages")[STAGES[i]])}</text>`+
      (i===pos?`<text class="here" x="${x}" y="${y+76}" text-anchor="middle">${esc(t("here"))}</text>`:"");
  }).join("");
  return `<svg viewBox="0 0 600 140" role="img" aria-label="${esc(t("arcTitle"))}: ${esc(t("stages")[STAGES[pos]])}"><path class="path" d="${d}"/>${walked}${nodes}</svg>`;
}

/* ---------- result ---------- */
function moodText(){ return [...state.mood.map(i=>t("moods")[i]), state.moodOther.trim()].filter(Boolean).join(", "); }
function summaryText(){
  const F=t("f"), sess = isIntake()?t("intake"):t("sess")(state.session);
  return [`${t("mailSubject")}${state.name?" – "+state.name:""} (${new Date().toLocaleDateString(lang==="da"?"da-DK":"en-GB")})`,
    `${F.type}: ${sess}`, `${F.q1}: ${state.q1||"–"}`, `${F.mood}: ${moodText()||"–"}`,
    `${F.q3}: ${state.q3||"–"}`, `${F.q4}: ${state.q4||"–"}`, `${F.use}: ${state.use||"–"}/5`,
    `${F.better}: ${state.better||"–"}`, `${F.ready}: ${state.ready?t("r")[state.ready][0]:"–"}`].join("\n");
}
const contactHref = () => CONFIG.contactUrl || (CONFIG.email ? `mailto:${CONFIG.email}` : "");
const mailto = (subject, body) => `mailto:${encodeURIComponent(CONFIG.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

function clientCopyText(){
  const [nh,nb]=t("nx")[state.ready], pos=stageOf(state.session), nextPos=Math.min(pos+1,3);
  const lines=[t("resTitle")(state.name),"",`${t("mailNext")}: ${nh}`, nb];
  if(state.ready==="book" && CONFIG.bookingUrl) lines.push(CONFIG.bookingUrl);
  if(state.note) lines.push("",`${t("coachSays")}:`, state.note);
  if(state.ready!=="pause"){
    lines.push("",t("mailWhy")+":");
    if(isIntake()) lines.push(t("whyIntake"));
    lines.push(pos<3 ? `${t("whyNext")(t("stages")[STAGES[nextPos]])} ${t("stageDesc")[STAGES[nextPos]]}` : t("stageDesc").land);
  }
  lines.push("","— "+t("mailAnswers")+" —", summaryText().split("\n").slice(1).join("\n"));
  if(contactHref()) lines.push("",`${t("contact")}: ${CONFIG.contactUrl||CONFIG.email}`);
  return lines.join("\n");
}

function renderResult(){
  const pos=stageOf(state.session), nextPos=Math.min(pos+1,3);
  const [nh,nb]=t("nx")[state.ready];
  const quotes = (isIntake() ? [[t("youSaid3i"),state.q3],[t("youSaid4i"),state.q4]] : [[t("youSaid1"),state.q1],[t("youSaid4s"),state.q4]])
    .filter(([,v])=>v.trim()).map(([c,v])=>`<p class="quote"><cite>${esc(c)}</cite><q>${esc(v.trim())}</q></p>`).join("");
  const whyBody = (isIntake()?`<p>${esc(t("whyIntake"))}</p>`:"") +
    (pos<3 ? `<p><b>${esc(t("whyNext")(t("stages")[STAGES[nextPos]]))}</b> ${esc(t("stageDesc")[STAGES[nextPos]])}</p>` : `<p>${esc(t("stageDesc").land)}</p>`);

  let primary="";
  if(state.ready==="book"){
    primary = CONFIG.bookingUrl ? `<a class="btn" href="${esc(CONFIG.bookingUrl)}" target="_blank" rel="noopener">${esc(t("bookBtn"))}</a>`
      : CONFIG.email ? `<a class="btn" href="${mailto(t("bookBtn"),summaryText())}">${esc(t("bookBtn"))}</a>` : "";
  } else if(state.ready==="ask" && CONFIG.email){
    primary = `<a class="btn" href="${mailto(t("askBtn"),summaryText())}">${esc(t("askBtn"))}</a>`;
  }
  const send = (!CONFIG.sheetUrl && CONFIG.email && state.ready!=="ask") ? `<a class="btn outline" href="${mailto(t("mailSubject"),summaryText())}">${esc(t("sendBtn"))}</a>` : "";

  app.innerHTML = `<div class="reveal">
    <h1>${esc(t("resTitle")(state.name))}</h1>
    <p class="muted">${esc(t("resSub"))}</p>

    <div class="panel next">
      <div class="kicker">${esc(t("nextKicker"))}</div>
      <h2>${esc(nh)}</h2>
      <p style="max-width:52ch;margin-bottom:${primary?22:0}px">${esc(nb)}</p>
      ${primary}
    </div>

    ${state.note?`<div class="card" style="margin-bottom:22px"><p class="muted small" style="margin-bottom:4px">${esc(t("coachSays"))}</p><p class="coachnote" style="margin:0">${esc(state.note)}</p></div>`:""}

    <div class="arc"><p class="muted small" style="margin-bottom:4px">${esc(t("arcTitle"))}</p>${arcSVG(pos)}</div>

    ${state.ready!=="pause" ? `<div class="card"><h2>${esc(t("whyTitle"))}</h2>${quotes}${whyBody}</div>` : (quotes?`<div class="card">${quotes}</div>`:"")}

    <div class="card" style="margin-top:22px;background:var(--pill)">
      <label class="qtitle" for="mine" style="font-size:1.4rem">${esc(t("mineTitle"))}</label>
      <p class="muted small">${esc(t("mineHint"))}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <input type="email" id="mine" autocomplete="email" inputmode="email" value="${esc(state.email)}" placeholder="${esc(t("mineLabel"))}" style="flex:1 1 220px;width:auto;background:var(--cream)">
        <button class="btn" data-act="mine">${esc(t("mineBtn"))}</button>
      </div>
      <p class="status" id="mineStatus" aria-live="polite" style="margin:10px 0 0"></p>
    </div>

    <div class="actions">
      ${contactHref()?`<a class="btn outline" href="${esc(contactHref())}" ${CONFIG.contactUrl?'target="_blank" rel="noopener"':''}>${esc(t("contact"))}</a>`:""}
      ${send}
      <button class="btn outline" data-act="copy">${esc(t("copyBtn"))}</button>
      <button class="linkbtn" data-act="again">${esc(t("again"))}</button>
    </div>
    <p class="status" id="status" aria-live="polite"></p></div>`;
  sendToSheet();
}

/* Sends answers to your Google Sheet (see apps-script.gs) */
async function sendToSheet(){
  if(!CONFIG.sheetUrl || sent) return;
  sent = true;
  const st=()=>$("#status");
  try{
    await fetch(CONFIG.sheetUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({type:"reflection", id:state.id, timestamp:new Date().toISOString(), lang, session:state.session, name:state.name,
        q1:state.q1, mood:moodText(), q3:state.q3, q4:state.q4, use:state.use, better:state.better,
        ready:state.ready ? T.en.r[state.ready][0] : "", note:state.note})});
    if(st()) st().textContent=t("saved");
  }catch(_){ sent=false; if(st()) st().textContent=t("saveFail"); }
}

/* ---------- events ---------- */
app.addEventListener("input", e=>{ const k=e.target.dataset.key; if(k) state[k]=e.target.value; });
app.addEventListener("click", async e=>{
  const b=e.target.closest("button,a"); if(!b) return;
  if(b.dataset.mood!==undefined){ const i=+b.dataset.mood; state.mood=state.mood.includes(i)?state.mood.filter(x=>x!==i):[...state.mood,i]; b.setAttribute("aria-pressed",state.mood.includes(i)); return; }
  if(b.dataset.use){ state.use=+b.dataset.use; app.querySelectorAll("[data-use]").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.use===state.use)); return; }
  if(b.dataset.ready){ state.ready=b.dataset.ready; app.querySelectorAll("[data-ready]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.ready===state.ready)); app.querySelector('[data-act="finish"]').disabled=false; return; }
  const a=b.dataset.act;
  if(a==="next"){ if(step===0){ readCoach(); $("#coach").open=false; } step++; render(); }
  if(a==="back"){ step=Math.max(0,step-1); render(); }
  if(a==="finish"){ step=STEPS.indexOf("result"); render(); }
  if(a==="copy"){ try{ await navigator.clipboard.writeText(summaryText()); b.textContent=t("copied"); }catch(_){} }
  if(a==="mine"){
    const inp=$("#mine"), out=$("#mineStatus"), em=inp.value.trim(); state.email=em;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ out.textContent=t("mineInvalid"); inp.focus(); return; }
    if(!CONFIG.sheetUrl){ location.href=`mailto:${encodeURIComponent(em)}?subject=${encodeURIComponent(t("mailSubject"))}&body=${encodeURIComponent(clientCopyText())}`; out.textContent=t("mineOpened"); return; }
    b.disabled=true;
    try{
      await fetch(CONFIG.sheetUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({type:"copy", id:state.id, email:em, subject:t("mailSubject"), text:clientCopyText(), replyTo:CONFIG.email})});
      out.textContent=t("mineSent");
    }catch(_){ out.textContent=t("mineFail"); b.disabled=false; }
  }
  if(a==="again"){ fresh(); if(coachMode) $("#coach").open=true; render(); }
});
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{ lang=b.dataset.lang; applyLang(); render(); }));
["#cName","#cNote","#cNum"].forEach(id=>{ $(id).addEventListener("input",()=>{ if(step===0) render(); }); $(id).addEventListener("change",()=>{ if(step===0) render(); }); });

/* ---------- boot ---------- */
if(coachMode) $("#coach").classList.remove("hidden");
applyLang(); fresh(); render();
</script>
</body>
</html>
