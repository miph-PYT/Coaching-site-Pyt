  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"21e07da3-895c-4f0e-9283-7fdf5ca1ce64\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"02eaa10f-d7b1-4a8b-9f5c-1acf49396523\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"21e07da3-895c-4f0e-9283-7fdf5ca1ce64\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"02eaa10f-d7b1-4a8b-9f5c-1acf49396523\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f5ead8;\n  --color-surface: #ebddc5;\n  --color-text: #201e1d;\n  --color-accent: #c67139;\n  --color-accent-2: #7a8a5e;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n<script src=\"3b07d193-aac4-4a40-8d25-1d908c116931\"><\u002Fscript>\n<script src=\"575d3788-2c72-4cd5-a9aa-8d592f805ae9\"><\u002Fscript>\n<style>\nbody{margin:0;background:var(--color-bg)}\na{color:var(--color-accent-700)}\na:hover{color:var(--color-accent-600)}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:var(--color-bg)\">\n  <header style=\"position:relative;overflow:hidden;background:var(--color-bg);color:var(--color-text);padding:clamp(20px,3vw,28px) clamp(20px,5vw,64px) clamp(64px,9vw,120px);display:flex;flex-direction:column;gap:clamp(48px,7vw,96px)\">\n    <nav style=\"position:relative;z-index:1;display:flex;align-items:center;gap:clamp(16px,3vw,32px);flex-wrap:wrap\">\n      <span style=\"font-family:var(--font-heading);font-size:24px;margin-right:auto\">Off Script<\u002Fspan>\n      <a href=\"#offer\" style=\"color:var(--color-text);text-decoration:none;font-size:15px\" style-hover=\"color:var(--color-accent-700)\">Coaching<\u002Fa>\n      <a href=\"#about\" style=\"color:var(--color-text);text-decoration:none;font-size:15px\" style-hover=\"color:var(--color-accent-700)\">About Me<\u002Fa>\n      <a href=\"#contact\" sc-camel-on-click=\"{{ goContact }}\" style=\"background:var(--color-accent);color:var(--color-bg);text-decoration:none;font-family:var(--font-heading);font-size:15px;padding:12px 22px;border-radius:999px\" style-hover=\"background:var(--color-accent-600)\">Say hello<\u002Fa>\n    <\u002Fnav>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(40px,5vw,72px);align-items:end;max-width:1280px\">\n      <div style=\"display: flex; flex-direction: column; gap: 28px; grid-column: span 2; min-width: 0; max-width: 760px; position: relative\">\n        <span style=\"font-size:18px;color:var(--color-accent-700)\">Hi, I'm Pyt.<\u002Fspan>\n        <h1 style=\"margin:0;font-size:clamp(44px,6vw,80px);line-height:1.04;text-wrap:balance\">Welcome to all the <span style=\"color:var(--color-accent)\">good girls and good boys<\u002Fspan> who are ready to be <span style=\"color:var(--color-accent-2-600)\">a little less good<\u002Fspan>.<\u002Fh1>\n        <p style=\"margin:0;font-size:clamp(17px,1.6vw,20px);line-height:1.6;color:var(--color-neutral-800);max-width:600px;text-wrap:pretty\">If you've ticked every box, followed the scrips and yet something's missing... An edge or aspect of yourself that does not quite fit into the identity you've built. <br><b>I would love to give that part of you space to unfold!<\u002Fb><\u002Fp>\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n          <a href=\"#contact\" sc-camel-on-click=\"{{ goContact }}\" style=\"background:var(--color-accent);color:var(--color-bg);text-decoration:none;font-family:var(--font-heading);font-size:17px;padding:16px 28px;border-radius:999px\" style-hover=\"background:var(--color-accent-600)\">Book a free intro call<\u002Fa>\n          <a href=\"#offer\" style=\"border:1px solid var(--color-accent);color:var(--color-accent-700);text-decoration:none;font-family:var(--font-heading);font-size:17px;padding:16px 28px;border-radius:999px\" style-hover=\"background:var(--color-accent-100)\">See what I offer<\u002Fa>\n        <\u002Fdiv>\n      <div style=\"position: absolute; left: 620px; width: 120px; height: 120px; border-radius: 50%; background: var(--color-accent-2-300); top: 242px\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"position:relative;justify-self:end;width:min(100%,380px)\">\n        \n        \n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section id=\"about\" style=\"padding:clamp(56px,8vw,104px) clamp(20px,5vw,64px) 0\">\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,320px),1fr)); gap: clamp(32px,5vw,72px); align-items: center; background: var(--color-accent-2-200); border-radius: 48px; padding: clamp(28px,5vw,64px); max-width: 1280px; width: 780px; height: 517px\">\n      <div style=\"display:flex;flex-direction:column;gap:20px;min-width:0\">\n        \n        <h2 style=\"margin:0;font-size:clamp(34px,4vw,52px);line-height:1.08;color:var(--color-accent-2-900);text-wrap:balance\">What led me here.<\u002Fh2>\n        <p style=\"margin:0;font-size:17px;line-height:1.65;color:var(--color-accent-2-900);max-width:560px;text-wrap:pretty\">I work a lot on the kinky edge of what normative society deems acceptable. I've found spaces where those parts of me got to be present without needing to hide. So I feel a special affinity to people who themselves feel like they have outgrown their container.<\u002Fp>\n        <p style=\"margin:0;font-size:17px;line-height:1.65;color:var(--color-accent-2-900);max-width:560px;text-wrap:pretty\">I have taken a coaching education in 2019 at Sofia Manning and have since then worked with many coaching clients get in touch with who they truly are and helping them achieve their personal and professional goals.&nbsp; &nbsp;<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n          \n          \n          \n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:min(100%,420px);aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--color-accent-2-300);justify-self:center\">\n        <image-slot id=\"about-photo\" class=\"washed\" shape=\"circle\" placeholder=\"Drop a photo of you at work or outdoors\" src=\"812cae74-3c55-41f1-8499-388b1a921f1b\"><\u002Fimage-slot>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"offer\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(32px,5vw,64px);padding:clamp(64px,8vw,112px) clamp(20px,5vw,64px);max-width:1400px\">\n    <div style=\"display:flex;flex-direction:column;gap:16px;max-width:380px\">\n      <h2 style=\"margin:0;font-size:clamp(36px,4vw,48px)\">What I offer<\u002Fh2>\n      <p style=\"margin:0;font-size:17px;line-height:1.6;color:var(--color-neutral-800)\">Every path starts with a free 20-minute call. <br>No pressure, no pitch.<\u002Fp>\n      <p style=\"margin: 12px 0 0; font-size: 17px; line-height: 1.6; color: var(--color-neutral-800); text-wrap: pretty; width: 713px; height: 67px\">All my coaching draws on parts work: getting to know the voices inside you, <br>including the ones you've kept hidden.<\u002Fp><a href=\"parts-work.html\" style=\"align-self:flex-start;white-space:nowrap;border:1px solid var(--color-accent);color:var(--color-accent-700);text-decoration:none;font-family:var(--font-heading);font-size:15px;padding:12px 22px;border-radius:999px\" style-hover=\"background:var(--color-accent-100)\">Discover what Parts Work is&nbsp;<\u002Fa>\n      \n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px;grid-column:span 2;min-width:0\">\n      <sc-for list=\"{{ offers }}\" as=\"o\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex;flex-direction:column;background:var(--color-surface);border-radius:44px;overflow:hidden\">\n          <button sc-camel-on-click=\"{{ o.toggle }}\" aria-expanded=\"{{ o.open }}\" style=\"display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;padding:22px 28px 22px 22px;background:transparent;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:44px\" style-hover=\"background:var(--color-neutral-300)\">\n            <span style=\"flex:none;width:56px;height:56px;border-radius:50%;background:{{ o.dot }};display:grid;place-items:center;font-family:var(--font-heading);font-size:22px\">{{ o.n }}<\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;gap:2px;flex:1 1 240px;min-width:0\">\n              <h3 style=\"margin:0;font-size:24px\">{{ o.title }}<\u002Fh3>\n              <span style=\"font-size:16px;line-height:1.5;color:var(--color-neutral-800)\">{{ o.body }}<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size:15px;font-weight:600;background:var(--color-bg);border-radius:999px;padding:6px 14px\">{{ o.meta }}<\u002Fspan>\n            <span style=\"flex:none;width:40px;height:40px;border-radius:50%;background:var(--color-bg);display:grid;place-items:center;font-family:var(--font-heading);font-size:22px;line-height:1;transition:transform .25s;transform:{{ o.rot }}\">+<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ o.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:28px;padding:4px 32px 32px 100px\">\n              <div style=\"display:flex;flex-direction:column;gap:14px\">\n                <p style=\"margin:0;font-size:16px;line-height:1.65;color:var(--color-neutral-900);text-wrap:pretty\">{{ o.detail }}<\u002Fp>\n                <div style=\"display:flex;flex-direction:column;gap:8px\">\n                  <sc-for list=\"{{ o.includes }}\" as=\"i\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex;gap:10px;align-items:baseline;font-size:15px;line-height:1.5\"><span style=\"flex:none;width:8px;height:8px;border-radius:50%;background:var(--color-accent);transform:translateY(-1px)\"><\u002Fspan>{{ i }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:14px;align-items:flex-start;background:var(--color-bg);border-radius:28px;padding:24px\">\n                <span style=\"font-family:var(--font-heading);font-size:36px;line-height:1\">{{ o.price }}<\u002Fspan>\n                <span style=\"font-size:14px;color:var(--color-neutral-700)\">{{ o.priceNote }}<\u002Fspan>\n                <a href=\"#contact\" sc-camel-on-click=\"{{ goContact }}\" style=\"background:var(--color-accent);color:var(--color-bg);text-decoration:none;font-family:var(--font-heading);font-size:15px;padding:12px 22px;border-radius:999px\" style-hover=\"background:var(--color-accent-600)\">Book a free intro call<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer id=\"contact\" style=\"margin:0 clamp(12px,2vw,24px) clamp(12px,2vw,24px);background:var(--color-accent-2-700);color:var(--color-neutral-100);border-radius:40px;padding:clamp(40px,6vw,72px) clamp(24px,5vw,56px);display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between;align-items:flex-end\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;max-width:560px\">\n      <h2 style=\"margin:0;font-size:clamp(32px,4vw,44px);color:var(--color-neutral-100)\">Curious? Let's just talk.<\u002Fh2>\n      <p style=\"margin:0;font-size:17px;line-height:1.6;color:var(--color-accent-2-100)\">I can tell you a whole lot about what I do, but in the end it is about whether we vibe and whether you like the way I work. <br>Let's spend 20 minutes, on video or a walk. <br>You'll leave with at least one honest question to sit with.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:12px;flex-wrap:wrap\"><a href=\"#contact\" id=\"book-call\" sc-camel-on-click=\"{{ bookCall }}\" style=\"white-space:nowrap;background:var(--color-bg);color:var(--color-text);text-decoration:none;font-family:var(--font-heading);font-size:17px;padding:16px 28px;border-radius:999px;transition:box-shadow .3s;box-shadow:{{ flash }}\" style-hover=\"background:var(--color-accent-2-200)\">Book a free intro call<\u002Fa><a href=\"#contact\" sc-camel-on-click=\"{{ mailMe }}\" style=\"white-space:nowrap;border:1px solid var(--color-accent-2-300);color:var(--color-neutral-100);text-decoration:none;font-family:var(--font-heading);font-size:17px;padding:16px 28px;border-radius:999px\" style-hover=\"background:var(--color-accent-2-600)\">Send a mail<\u002Fa><\u002Fdiv>\n  <\u002Ffooter>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between;align-items:flex-start;padding:28px clamp(20px,5vw,64px) 40px;font-size:14px;line-height:1.6;color:var(--color-neutral-800)\">\n    <div style=\"display:flex;flex-direction:column;gap:2px\">\n      <span style=\"font-weight:700;color:var(--color-text)\">Off Script v/ Philipp Mitterhofer<\u002Fspan>\n      <span>CVR: 41445726<\u002Fspan>\n      <span>Nørre Farmiagsgade 65, 1364 København<\u002Fspan>\n      <span><a href=\"#contact\" sc-camel-on-click=\"{{ mailMe }}\">{{ email }}<\u002Fa><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n      <button sc-camel-on-click=\"{{ openTerms }}\" style=\"white-space:nowrap;font:inherit;font-size:14px;background:var(--color-surface);color:var(--color-text);border:0;border-radius:999px;padding:8px 16px;cursor:pointer\" style-hover=\"background:var(--color-neutral-300)\">Terms &amp; cancellation<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ openPrivacy }}\" style=\"white-space:nowrap;font:inherit;font-size:14px;background:var(--color-surface);color:var(--color-text);border:0;border-radius:999px;padding:8px 16px;cursor:pointer\" style-hover=\"background:var(--color-neutral-300)\">Privacy &amp; cookies<\u002Fbutton>\n    <\u002Fdiv>\n    <span style=\"flex-basis:100%;font-size:13px;color:var(--color-neutral-700)\">Coaching is not therapy or medical treatment. All prices are in DKK incl. 25% VAT. © 2026<\u002Fspan>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ legalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeLegal }}\" style=\"position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:color-mix(in srgb, var(--color-neutral-900) 50%, transparent)\">\n      <div sc-camel-on-click=\"{{ stop }}\" role=\"dialog\" aria-modal=\"true\" style=\"width:min(640px,100%);max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:clamp(24px,4vw,40px);border-radius:32px;background:var(--color-bg);box-shadow:var(--shadow-lg);font-size:15px;line-height:1.6\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px\">\n          <h2 style=\"margin:0;font-size:30px\">{{ legalTitle }}<\u002Fh2>\n          <button sc-camel-on-click=\"{{ closeLegal }}\" aria-label=\"Close\" style=\"flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--color-surface);cursor:pointer;font-family:var(--font-heading);font-size:22px;line-height:1;transform:rotate(45deg)\" style-hover=\"background:var(--color-neutral-300)\">+<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showTerms }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <h4 style=\"margin:8px 0 0\">Who you're buying from<\u002Fh4>\n            <p style=\"margin:0\">Off Script v/ Philipp Mitterhofer, CVR 41445726, Nørre Farmiagsgade 65, 1364 København, <a href=\"#contact\" sc-camel-on-click=\"{{ mailMe }}\">{{ email }}<\u002Fa>.<\u002Fp>\n            <h4 style=\"margin:8px 0 0\">Prices and payment<\u002Fh4>\n            <p style=\"margin:0\">All prices are in Danish kroner incl. 25% VAT. You'll receive an invoice after booking, payable by bank transfer or MobilePay within 8 days, and before the first session.<\u002Fp>\n            <h4 style=\"margin:8px 0 0\">Your 14-day right of withdrawal<\u002Fh4>\n            <p style=\"margin:0\">When you book online, by email or by phone, you can withdraw within 14 days of the agreement without giving a reason. Just email us a clear message. If you ask to start within those 14 days and then withdraw, you pay for the part already delivered. Once the service is fully delivered, the right of withdrawal ends.<\u002Fp>\n            <h4 style=\"margin:8px 0 0\">Rescheduling and cancellation<\u002Fh4>\n            <p style=\"margin:0\">Sessions can be moved or cancelled free of charge up to 48 hours before. Later cancellations are charged in full. In group circles, missed evenings aren't refunded.<\u002Fp>\n            <h4 style=\"margin:8px 0 0\">About coaching<\u002Fh4>\n            <p style=\"margin:0\">Coaching is not therapy, psychological or medical treatment. You're responsible for your own choices. If you're in crisis, contact your doctor or Livslinien (70 201 201).<\u002Fp>\n            <h4 style=\"margin:8px 0 0\">Complaints<\u002Fh4>\n            <p style=\"margin:0\">Contact us first at <a href=\"#contact\" sc-camel-on-click=\"{{ mailMe }}\">{{ email }}<\u002Fa>. You can also complain to Nævnenes Hus (naevneneshus.dk) or via the EU complaints portal (ec.europa.eu/odr).<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ showPrivacy }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <h4 style=\"margin:8px 0 0\">Data controller<\u002Fh4>\n            <p style=\"margin:0\">Off Script v/ Philipp Mitterhofer, CVR 41445726, Nørre Farmiagsgade 65, 1364 København, <a href=\"#contact\" sc-camel-on-click=\"{{ mailMe }}\">{{ email }}<\u002Fa>.<\u002Fp>\n            <h4 style=\"margin:8px 0 0\">What we collect and why<\u002Fh4>\n            <p style=\"margin:0\">Name, contact details and what you choose to share with us, so we can book, deliver and invoice sessions. The legal basis is our agreement with you (GDPR art. 6(1)(b)) and our bookkeeping duty (art. 6(1)(c)). Anything personal you share in sessions stays confidential.<\u002Fp>\n            <h4 style=\"margin:8px 0 0\">How long we keep it<\u002Fh4>\n            <p style=\"margin:0\">Session notes are deleted 12 months after our last session. Invoices are kept for 5 years, as the Danish Bookkeeping Act requires.<\u002Fp>\n            <h4 style=\"margin:8px 0 0\">Who we share it with<\u002Fh4>\n            <p style=\"margin:0\">Only with the processors we need, such as email, calendar and accounting providers, all under data processing agreements. We never sell your data.<\u002Fp>\n            <h4 style=\"margin:8px 0 0\">Your rights<\u002Fh4>\n            <p style=\"margin:0\">You can ask for access, correction, deletion, restriction or a copy of your data, and object to processing. You can complain to Datatilsynet (datatilsynet.dk).<\u002Fp>\n            <h4 style=\"margin:8px 0 0\">Cookies<\u002Fh4>\n            <p style=\"margin:0\">This website only uses technically necessary cookies and no tracking or marketing cookies, so no consent banner is needed. If that changes, we'll ask for your consent first.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { open: null, flash: false };\n  componentDidMount() { if (location.hash === '#contact') setTimeout(() => this.goContact(), 400); }\n  goContact(e) {\n    if (e) e.preventDefault();\n    const el = document.getElementById('contact');\n    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 24, behavior: 'smooth' });\n    this.setState({ flash: true });\n    clearTimeout(this._t); this._t = setTimeout(() => this.setState({ flash: false }), 1600);\n  }\n  renderVals() {\n    const offers = [\n      { n: 1, dot: 'var(--color-accent-300)', title: 'Clarity session', body: \"One deep conversation to name what's missing.\", meta: '90 min',\n        detail: \"A single, unhurried session to slow down and look honestly at where you are. We'll untangle the shoulds from the wants and find the thread worth pulling.\",\n        includes: ['90 minutes in Copenhagen or on video', 'A short reflection to fill in beforehand', 'Written notes and one next step afterwards'],\n        price: '1.400 kr', priceNote: 'Single session, incl. VAT' },\n      { n: 2, dot: 'var(--color-accent-2-300)', title: 'Off Script 1:1', body: 'Three months to rewrite the rules you live by.', meta: '3 months',\n        detail: \"Deep, steady work over three months. We look at the scripts you've been living by, notice what your body and gut already know, and try new ways of being in small, real steps.\",\n        includes: ['6 sessions of 75 minutes, every other week', 'Messaging support between sessions', 'Embodiment and parts-work practices to take home'],\n        price: '9.600 kr', priceNote: 'Or 3 × 3.200 kr monthly, incl. VAT' },\n      { n: 3, dot: 'var(--color-neutral-300)', title: 'Small-group circle', body: 'Six evenings with people asking the same question.', meta: '6 weeks',\n        detail: \"A small, held circle of people who've also done everything right and still feel something's missing. Honest conversation, playful exercises, and the relief of not being the only one.\",\n        includes: ['6 weekly evenings of 2.5 hours in Copenhagen', 'Max 6 participants', 'Tea, snacks and a lot of honesty'],\n        price: '2.900 kr', priceNote: 'Full series, incl. VAT' },\n    ];\n    const legal = this.state.legal;\n    const email = ['kd.knikftos', 'typ'].map(s => s.split('').reverse().join('')).reverse().join(String.fromCharCode(64));\n    return {\n      email,\n      goContact: e => this.goContact(e),\n      pathFresh: () => { try { localStorage.removeItem('offscript-tree'); } catch (e) {} },\n      pathStages: ['Learning love', 'Gold stars', 'The ladder', 'Every box', 'The cracks'].map((label, i) => ({ n: i + 1, label })),\n      pathOptions: [['…went quiet and read the room', 'reader'], ['…tucked my big feelings away and got easy', 'little']].map(([text, id], j) => ({\n        text, mark: 'AB'[j], go: () => { try { localStorage.setItem('offscript-tree', JSON.stringify([id])); } catch (e) {} } })),\n      flash: this.state.flash ? '0 0 0 6px var(--color-accent-2-300)' : '0 0 0 0 transparent',\n      bookCall: e => { e.preventDefault(); window.location.href = 'mai' + 'lto:' + email + '?subject=' + encodeURIComponent('Free intro call') + '&body=' + encodeURIComponent(\"Hi Pyt,\\n\\nI'd love to book a free 20-minute intro call.\\n\\nGood times for me:\\n\\n\"); },\n      mailMe: e => { e.preventDefault(); window.location.href = 'mai' + 'lto:' + email; },\n      legalOpen: !!legal,\n      showTerms: legal === 'terms',\n      showPrivacy: legal === 'privacy',\n      legalTitle: legal === 'terms' ? 'Terms & cancellation' : 'Privacy & cookies',\n      openTerms: () => this.setState({ legal: 'terms' }),\n      openPrivacy: () => this.setState({ legal: 'privacy' }),\n      closeLegal: () => this.setState({ legal: null }),\n      stop: e => e.stopPropagation(),\n      offers: offers.map((o, i) => ({ ...o, open: this.state.open === i, rot: this.state.open === i ? 'rotate(45deg)' : 'none',\n        toggle: () => this.setState(s => ({ open: s.open === i ? null : i })) })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
